[supervisord]
nodaemon=true
user=appuser
loglevel=info
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:backend]
command=python -m uvicorn proxy_logic:app --host 0.0.0.0 --port 8000
directory=/app
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",PYTHONIOENCODING="utf-8"

[program:admin]
command=python -m streamlit run admin_panel.py --server.address 0.0.0.0 --server.port 8501 --server.headless true --browser.gatherUsageStats false
directory=/app
autostart=true
autorestart=true
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",PYTHONIOENCODING="utf-8"
startsecs=10
