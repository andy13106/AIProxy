services:
  aiproxy:
    build:
      context: .
      dockerfile: Dockerfile-cn
    container_name: aiproxy
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - aiproxy_network

networks:
  aiproxy_network:
    driver: bridge
