<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIProxy Playground</title>
  <link rel="stylesheet" href="/playground-ui/style.css?v=hermes-style-1">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="side-head">
        <button id="newSessionBtn" class="new-chat-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          新对话
        </button>
      </div>
      <div id="sessionList" class="session-list"></div>
    </aside>
    <main class="main">
      <div id="messages" class="messages">
        <div id="emptyState" class="empty-state">
          <div class="empty-logo">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="48" height="48" aria-label="AIProxy">
              <defs>
                <linearGradient id="logo-gold" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1"/>
                  <stop offset="100%" style="stop-color:#DAA520;stop-opacity:1"/>
                </linearGradient>
              </defs>
              <rect x="30" y="10" width="4" height="46" rx="2" fill="url(#logo-gold)"/>
              <path d="M30 18 C24 14, 14 14, 10 18 C14 16, 22 16, 28 20" fill="#FFD700" opacity="0.9"/>
              <path d="M34 18 C40 14, 50 14, 54 18 C50 16, 42 16, 36 20" fill="#FFD700" opacity="0.9"/>
              <circle cx="32" cy="10" r="4" fill="#FFD700"/>
            </svg>
          </div>
          <h2>What can I help with?</h2>
          <p>选择模型、上传附件，然后开始对话。</p>
        </div>
        <div class="messages-inner" id="msgInner"></div>
      </div>
      <div class="composer-wrap" id="composerWrap">
        <div class="composer-box" id="composerBox">
          <div class="attach-tray" id="attachTray"></div>
          <textarea id="promptInput" placeholder="Message AIProxy…"></textarea>
          <div class="composer-footer">
            <div class="composer-left">
              <input id="fileInput" type="file" multiple hidden>
              <button class="icon-btn" id="uploadBtn" title="Attach files">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                </svg>
              </button>
              <div class="composer-divider" aria-hidden="true"></div>
              <div class="composer-provider-wrap">
                <button class="composer-provider-chip" id="providerChip" type="button" title="切换Provider">
                  <span class="composer-provider-icon" aria-hidden="true">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <rect x="3" y="3" width="18" height="18" rx="2"/>
                      <rect x="7" y="7" width="10" height="10"/>
                    </svg>
                  </span>
                  <span class="composer-provider-label" id="providerLabel"></span>
                  <span class="composer-provider-chevron" aria-hidden="true">
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <polyline points="6 9 12 15 18 9"/>
                    </svg>
                  </span>
                </button>
                <select id="providerSelect" class="composer-provider-select" title="选择Provider">
                </select>
              </div>
              <div class="composer-model-wrap">
                <button class="composer-model-chip" id="modelChip" type="button" title="选择模型">
                  <span class="composer-model-icon" aria-hidden="true">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <rect x="4" y="4" width="16" height="16" rx="2"/>
                      <rect x="9" y="9" width="6" height="6"/>
                      <path d="M15 2v2"/>
                      <path d="M15 20v2"/>
                      <path d="M2 15h2"/>
                      <path d="M2 9h2"/>
                      <path d="M20 15h2"/>
                      <path d="M20 9h2"/>
                      <path d="M9 2v2"/>
                      <path d="M9 20v2"/>
                    </svg>
                  </span>
                  <span class="composer-model-label" id="modelLabel"></span>
                  <span class="composer-model-chevron" aria-hidden="true">
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <polyline points="6 9 12 15 18 9"/>
                    </svg>
                  </span>
                </button>
                <select id="modelSelect" class="composer-model-select" title="选择模型">
                </select>
              </div>
              <div class="provider-dropdown" id="providerDropdown"></div>
              <div class="model-dropdown" id="modelDropdown"></div>
            </div>
            <div class="composer-right">
              <button class="cancel-btn" id="stopBtn" title="停止生成" style="display:none">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="5" y="5" width="14" height="14" rx="2"/>
                </svg>
              </button>
              <button class="send-btn" id="sendBtn" title="发送消息">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <line x1="12" y1="19" x2="12" y2="5"/>
                  <polyline points="5 12 12 5 19 12"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="/playground-ui/app.js?v=hermes-style-1"></script>
</body>
</html>
